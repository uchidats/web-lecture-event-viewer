name: Deploy dual-path OphthalConf

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Conference Auto Updater v1]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dual-path-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-conference-regressions.js
      - run: node scratch/test_dual_site.js
      - uses: actions/configure-pages@v5
      - run: node scripts/build-dual-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
